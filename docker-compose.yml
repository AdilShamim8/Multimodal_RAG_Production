# =========================================================================
# Multimodal RAG Production — Docker Compose stack
# Services: api, qdrant, redis (cache), prometheus, grafana
# Usage:   docker compose up -d
# =========================================================================
services:
  api:
    build: .
    image: multimodal-rag:latest
    container_name: mrag-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
    networks: [mrag-net]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: mrag-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mrag-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mrag-redis
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    networks: [mrag-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: mrag-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [mrag-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mrag-grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [mrag-net]
    restart: unless-stopped

volumes:
  qdrant-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  mrag-net:
    driver: bridge
