[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multimodal-rag-production"
version = "1.0.0"
description = "Production-grade Multimodal RAG pipeline (embed → retrieve → rerank → generate) with pluggable providers and vector stores."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Adil Shamim (rebuild)" }]
keywords = ["rag", "multimodal", "nlp", "retrieval-augmented-generation", "fastapi", "qdrant", "faiss"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  # Config + validation
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  # HTTP + retry
  "httpx>=0.27.0",
  "tenacity>=8.4.0",
  # Rate limiting
  "slowapi>=0.1.9",
  # Caching
  "cachetools>=5.3.0",
  # Vector stores
  "qdrant-client>=1.10.0",
  "chromadb>=0.5.5",
  "faiss-cpu>=1.8.0",
  # ML / embeddings (heavy; lazy-imported inside providers)
  "numpy>=1.26.0",
  "pillow>=10.3.0",
  "safetensors>=0.4.3",
  "tqdm>=4.66.0",
  # Dataset
  "datasets>=2.20.0",
  # CLI
  "typer>=0.12.3",
  "rich>=13.7.0",
  # Logging
  "structlog>=24.1.0",
  # Monitoring
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# Heavy local HF models (NVIDIA Nemotron + Qwen3-VL)
gpu = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "sentencepiece>=0.2.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-Pillow",
  "httpx>=0.27.0",
]
docs = ["python-docx>=1.1.0"]

[project.scripts]
multimodal-rag = "multimodal_rag.cli:app"

[project.urls]
Homepage = "https://github.com/AdilShamim8/Multimodal_RAG_Production"
Repository = "https://github.com/AdilShamim8/Multimodal_RAG_Production"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_rag"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=multimodal_rag --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "gpu: marks tests that require a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "SIM", "TID", "PL"]
ignore = ["E501", "PLR0913", "PLR2004", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["notebooks/", "build/", "dist/"]

[tool.coverage.run]
source = ["src/multimodal_rag"]
omit = ["*/tests/*", "*/__main__.py"]
